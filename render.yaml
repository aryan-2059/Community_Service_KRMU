services:
  - type: web
    name: reelearn-server
    runtime: node
    rootDir: server
    buildCommand: npm install && npm run build
    startCommand: npm start
    envVars:
      - key: JWT_SECRET
        generateValue: true
      - key: JSON_STORE_PATH
        value: ./data/reelearn.json
      - key: CLIENT_URL
        sync: false
      - key: NODE_ENV
        value: production
